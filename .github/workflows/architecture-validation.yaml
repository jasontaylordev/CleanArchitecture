name: Architecture validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect architecture changes
    runs-on: ubuntu-latest
    outputs:
      architecture_changed: ${{ steps.changes.outputs.architecture_changed }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect architecture paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "architecture_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA"...HEAD |
            grep -q '^docs/architecture/'; then
            echo "architecture_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "architecture_changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Deterministic architecture validation
    needs: detect
    if: needs.detect.outputs.architecture_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-architecture.txt

      - name: Install deterministic tooling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-architecture.txt

      - name: Validate scope against JSON Schema
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_json_schema.py \
            schemas/bootstrap-scope.schema.json \
            .architecture/bootstrap-scope.yaml

      - name: Validate architecture files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ -n "${BASE_SHA:-}" ]]; then
            python scripts/validate_architecture.py \
              --scope .architecture/bootstrap-scope.yaml \
              --base "$BASE_SHA"
          else
            python scripts/validate_architecture.py \
              --scope .architecture/bootstrap-scope.yaml
          fi

  required:
    name: Architecture validation required check
    needs:
      - detect
      - validate
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate architecture validation
        shell: bash
        env:
          ARCHITECTURE_CHANGED: ${{ needs.detect.outputs.architecture_changed }}
          DETECT_RESULT: ${{ needs.detect.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Architecture path detection failed."
            exit 1
          fi

          if [[ "$ARCHITECTURE_CHANGED" == "true" &&
                "$VALIDATE_RESULT" != "success" ]]; then
            echo "Architecture validation did not succeed."
            exit 1
          fi

          echo "Architecture validation requirement satisfied."