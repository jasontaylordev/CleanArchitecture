name: Test Templates

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-template:
    name: ${{ matrix.framework }}-${{ matrix.client-framework }}-${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        client-framework: [angular, react, none]
        database: [sqlite, sqlserver, postgresql]

    steps:
    - uses: actions/checkout@v7
      name: Checkout code

    # Install only this job's SDK, into a fresh folder so the runner image's preinstalled SDKs aren't
    # visible. A .NET 11 job then can't quietly depend on the .NET 10 runtime (as NSwag's Net100 build did).
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: ${{ matrix.framework == 'net11.0' && '11.0.x' || '10.0.x' }}

    - name: Show .NET SDKs and runtimes
      run: dotnet --info

    - name: Install Node & cache npm packages
      if: matrix.client-framework != 'none'
      uses: actions/setup-node@v7
      with:
        node-version: '26.x'
        cache: 'npm'
        cache-dependency-path: |
          src/Web/ClientApp/package-lock.json
          src/Web/ClientApp-React/package-lock.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ matrix.framework }}-${{ matrix.client-framework }}-${{ matrix.database }}-${{ hashFiles('**/Directory.Packages*.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install template
      run: dotnet new install .

    - name: Generate solution
      run: |
        dotnet new ca-sln \
          --framework ${{ matrix.framework }} \
          --client-framework ${{ matrix.client-framework }} \
          --database ${{ matrix.database }} \
          --name CleanArchitecture \
          --output generated \
          --no-update-check

    - name: Build solution
      working-directory: generated
      run: dotnet build --configuration Release

    - name: Build client app
      if: matrix.client-framework != 'none'
      working-directory: generated/src/Web/ClientApp
      run: |
        npm ci
        npm run build

    - name: Install Playwright browsers
      if: matrix.client-framework != 'none'
      working-directory: generated
      run: pwsh artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium

    - name: Test solution
      working-directory: generated
      run: dotnet test --no-build --configuration Release
